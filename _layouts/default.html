<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.path contains 'reports/' %}{{ page.path | remove: 'reports/' | remove: '.md' }} | {% endif %}ITニュースレポート</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --link:#1d4ed8; --line:#e7e5e4; --quote:#f5f5f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#e7e5e4; --muted:#a8a29e; --link:#93c5fd; --line:#44403c; --quote:#292524; } }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Meiryo",sans-serif; line-height:1.8; margin:0; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--link); }
  h1 { font-size:1.6rem; } h2 { margin-top:2.2em; padding-bottom:.3em; border-bottom:1px solid var(--line); }
  h3 { font-size:1.05rem; margin:1.6em 0 .4em; }
  blockquote { margin:0; padding:.6em 1em; background:var(--quote); border-left:4px solid var(--line); border-radius:4px; }
  hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
  nav { font-size:.9rem; color:var(--muted); margin-bottom:8px; }
</style>
</head>
<body>
<main>
{% unless page.url == "/" %}<nav><a href="{{ '/' | relative_url }}">← レポート一覧</a></nav>{% endunless %}
{{ content }}
</main>
<script>
  // 外部サイトへのリンクはすべて新しいタブで開く
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.hostname && a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });
</script>
</body>
</html>
